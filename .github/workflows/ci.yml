name: ci

# 门禁口径与 docs/reports/p2-exit-evidence.md §9 一致：本地手工跑的命令，这里原样跑一遍。
# 两个平台都要跑：P2 曾出现「Windows 绿、Linux 红」（僵尸进程被 kill -0 判为存活），
# 单平台绿不能当证据。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 与本地一致的关闭增量，避免 CI 缓存与增量产物互相干扰。
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (linux)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— `xtask` 的 impact 用例要跑真实提交（`HEAD~1..HEAD`）。
      # 默认浅克隆没有父提交，那条用例会红，而红的原因看起来像「impact 分析坏了」。
      # 2026-11-23 查明：CI「全量测试」从 2026-11-21 起一直红的**唯一**原因就是它。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 工具链由 rust-toolchain.toml 钉住；rustup show 会按该文件安装。
      - name: 安装钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: 格式
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast：任一测试二进制失败时仍跑完其余，避免总数骤降掩盖第二条红灯。
      #
      # 为什么要 `tee` 一份日志：这条步骤从 2026-11-21 起一直红，而匿名访问
      # `/actions/jobs/{id}/logs` 是 403，失败用例名根本拿不到——红灯就成了一条
      # 无法处置的红灯。日志只在失败时上传（见下一步），正常跑不受影响。
      # GitHub 的 bash 默认带 `-eo pipefail`，所以 `| tee` 不会吞掉 cargo 的退出码。
      - name: 全量测试
        shell: bash
        run: cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-linux
          path: ${{ runner.temp }}/cargo-test.log
          if-no-files-found: warn
      # artifact 要登录才能下载，日志本身也是 403——但**注解是公开可读的**
      # （`/repos/{owner}/{repo}/check-runs/{id}/annotations`）。所以把失败用例名
      # 与失败段原文顶到注解里，让这条红灯至少能被匿名诊断。
      #
      # `set +e`：上面那次就是被 `-e` + `pipefail` 坑死的——`grep` 没匹配到行时退出 1，
      # 整个赋值失败，步骤直接红，注解反而没写出去。诊断步骤自己不许再失败一次。
      - name: 把失败摘要写进注解
        if: failure()
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/cargo-test.log"
          # 用例名有两种形态：`mod::test`（模块内）与 `test`（测试二进制根上，比如
          # `every_cited_target_exists_on_disk`）。上一版正则要求至少一个 `::`，把
          # 根上的名字整个丢掉，注解写着「没认出用例名」——那比不给名字更误导：
          # 会让人以为失败不在断言上。只在 `failures:` 之后的缩进清单里取。
          names=$(awk '
            /^failures:$/ { inblk = 1; next }
            inblk && /^    [A-Za-z0-9_]+(::[A-Za-z0-9_]+)*$/ { sub(/^    /, ""); print; next }
            inblk { inblk = 0 }
          ' "$log" 2>/dev/null | sort -u | head -10 | paste -sd, -)
          [ -z "$names" ] && names="（没认出用例名：可能不是断言失败，见下一条注解）"
          echo "::error title=cargo test 失败用例::${names}"
          body=$(awk '/^failures:$/{flag=1} flag' "$log" 2>/dev/null | head -120 | cut -c1-200 | tr '\n' '~')
          [ -z "$body" ] && body=$(tail -40 "$log" 2>/dev/null | cut -c1-200 | tr '\n' '~')
          echo "::error title=cargo test 失败段::$(printf '%s' "$body" | cut -c1-6000)"
          exit 0
      - name: 门禁 G-1/G-50
        run: cargo run -q -p xtask -- verify --stage P0
      - name: 迁移检查
        run: cargo run -q -p xtask -- migration-check
      # 防新增孤岛。**这是弱门禁**：只比模块归属（live/orphan/test_only），不比行数；
      # 既有模块膨胀它看不出来。别把它当成「不可达比例不会上升」的保证。
      - name: 不可达基线
        run: cargo run -q -p xtask -- reach --check verification/reach-baseline.tsv
      - name: 规格索引
        run: cargo run -q -p bod -- verify-index

  rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      # 同 linux job：impact 用例要 `HEAD~1`，浅克隆会红。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 与 linux job 同一套：保留日志 + 失败时把用例名顶成注解。
      # 两个平台都红过，只诊断一边等于把另一半留在黑暗里。
      - name: 全量测试
        shell: bash
        run: cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-windows
          path: ${{ runner.temp }}/cargo-test.log
          if-no-files-found: warn
      - name: 把失败摘要写进注解
        if: failure()
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/cargo-test.log"
          names=$(awk '
            /^failures:$/ { inblk = 1; next }
            inblk && /^    [A-Za-z0-9_]+(::[A-Za-z0-9_]+)*$/ { sub(/^    /, ""); print; next }
            inblk { inblk = 0 }
          ' "$log" 2>/dev/null | sort -u | head -10 | paste -sd, -)
          [ -z "$names" ] && names="（没认出用例名：可能不是断言失败，见下一条注解）"
          echo "::error title=cargo test 失败用例::${names}"
          body=$(awk '/^failures:$/{flag=1} flag' "$log" 2>/dev/null | head -120 | cut -c1-200 | tr '\n' '~')
          [ -z "$body" ] && body=$(tail -40 "$log" 2>/dev/null | cut -c1-200 | tr '\n' '~')
          echo "::error title=cargo test 失败段::$(printf '%s' "$body" | cut -c1-6000)"
          exit 0

  openspec:
    name: openspec (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 版本与本地一致，避免「本地 19/19、CI 报新错误」的漂移。
      - name: 安装 openspec
        run: npm i -g @fission-ai/openspec@1.15.0
      - name: 校验全部规格
        run: openspec validate --all --strict

  workbench:
    name: workbench (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build

# 全局架构规范：context 会注入每个 Change 的所有工件指令。
# 权威来源：docs/bod-V2.9.6-智能体协作开放平台完整产品与开发方案.md（下称“方案文档”）。
context: |
  # bod V2.9.6 总体架构规范

  ## 1. 产品与系统边界
  - bod 是智能体协作开放平台：宿主可信控制面 + 外部 Agent 执行端。控制面负责权限、原子认领、调度、账本、状态与接受决策；外部 Agent 执行智能任务。
  - 首个稳定目标为本地单用户、默认 Company 多 Project、Linux/WSL。SQLite 是权威业务记录，文件存储是默认制品位置，无外部服务硬依赖。
  - 技术基线：独立 bod Rust 服务是唯一业务写入者；三个核心生产 crate + Tauri 2 桌面壳 crate + 开发专用 xtask。桌面界面用 Vue 3/TypeScript/Vite，不另建 DB 或调度；CLI 与桌面共用同一宿主。
  - 明确不做：自研 Harness、内置模型工具推理循环、全局 Agent 互调网络、IDE 反向编排插件、固定四级递归团队、替代 Git/知识库/制品库的独立专业系统。
  - 按需后置且非默认依赖：集群高可用、PostgreSQL、多机执行、容器/WASM 沙箱、向量检索、在线市场、自动模型路由学习、大型组织图。
  - 逻辑边界不自动变成独立 crate、进程、插件协议或数据库。新增常驻服务、默认依赖、一级对象、配置字段或协议前，必须说明真实场景、现有实现不足、依赖/运维代价与撤除路径（§2.4）。

  ## 2. 十二条设计原则（§2.1）
  1. 管理习惯兼容：Company/Project/Agent/Issue/Team Catalog 沿用 Paperclip 概念含义，增强叠加在这些对象之上。
  2. 入口简单：创建项目、接入 Agent、提交任务即可开始，不强制 Team、WorkPackage、Run 或组织层级。
  3. 控制面确定性：权限、原子认领、调度、账本、状态和接受由宿主负责，不依赖协调 Agent 持续在线。
  4. 外部 Agent 执行智能任务：不开发 mini harness，不嵌入模型工具推理循环。
  5. 扁平协作：按工作依赖、接口和成果交接，组织汇报关系不等于执行调用链。
  6. 共享规格基线：按变更组织、按工作包分工、按确定修订交接，不为每个 Agent 复制整套系统规格。
  7. 完成必须可验：Agent 提交候选，门禁与有权主体接受；退出码、聊天“完成”和业务验收分开。
  8. 专业系统保持权威：Git 管代码、知识库管原生文档、制品库管包；bod 统一登记引用、依赖、证据和阶段清单。
  9. 治理能力诚实声明：对黑盒 Agent 不承诺全路径硬停、网络隔离和精确成本；Unknown 先对账。
  10. 默认轻量：单宿主、SQLite、文件存储、Tauri 2 工作台及 CLI；按实际需求加载外部能力。
  11. 内部模块优先：逻辑边界不自动物理分散。
  12. 扩展由验证支撑：API、协议子集、兼容版本、容量和性能均在实现后发布支持矩阵。

  ## 3. 状态、事务与协调
  - 接受/状态转换在同一事务内完成 expected_version 校验、不变量检查、事件追加、租约/账本/预留更新与 outbox 意图写入；网络或人工等待不得持有数据库写锁。
  - 请求幂等回执与资源待办代数分开；开始/唤醒回包丢失先按 invocation_id 或业务键查询，不明非幂等外部操作不自动重发。
  - 资源状态单一写入者：status 只由指定领域命令写入，Agent 反馈不能伪造接受；每工作包只有一个有效提交租约，旧 fencing token 不能更新宿主受管状态。
  - 可靠消息默认是数据库持久队列 + outbox；进程内通知只用于加速，外部 MQ 可选。缓存有界且按版本复用，权威记录不能当可淘汰缓存。
  - 事件回放只重建有定义的投影，不重新发起模型、部署或通知；合法升级可改变派生投影，但必须提供解释与迁移验证。

  ## 4. 外部副作用、预算与授权
  - Effect Gate：外部副作用先持久意图，事务提交后执行；成功但回包丢失先按幂等键查询，无法确认则进入 Unknown 并对账，不清空风险预留、不宣称成功。
  - 预算预留原子检查所有适用层级；实际费用如实追加，调整必须带来源，不通过丢弃超额维持虚假平衡；同一实际用量按 usage_key 去重。
  - 一次性同意不能授权不同逻辑动作；当前权限不因低层配置、Profile、Skill 或反馈扩大；跨项目 Agent 复用不复用未授权会话、凭据和上下文。
  - 预算、槽位、Binding 与派发意图按声明事务边界一致。磁盘满等资源故障停止新派发，保留未确认接收状态并告警。
  - Company 隔离、身份、授权和审计由可信宿主执行；成员身份、目录安装和任务指派都不自动取得全部项目权限。

  ## 5. 成果、验收与恢复治理
  - 明确区分“分配了什么、收到什么、接受了什么”：Agent 提交候选，门禁和有权主体接受；接受绑定确定规格修订、产物、验证规则与证据。
  - 已冻结 Manifest 只引用确定不可变修订；合并证据对应真实目标与候选组合，主干更新后必须重建候选验证。
  - 覆盖报告限定证据来源，不超出实际来源；交付回执不夸大真实性或法律意义；没有实测时保留 Target/Unverified。
  - 删除与清理不静默销毁外部共享资源，不明清理留案件；备份恢复到新宿主后重新验证会话/凭据/进程，Unknown 先对账。
  - 治理声明与实现一致：声称强隔离的路径必须通过运行器测试；不支持 ACK/配额/恢复的运行时在界面明确限制，不能因“协议已定义”标为 Supported。

  ## 6. 验证体系与发布门禁（§39、§41.11）
  - 四类测试：领域属性、适配器契约、确定性仿真、真实端到端。录制/回放保存请求摘要、组件/描述符/配置版本与返回，敏感内容按授权脱敏；不声称真实模型输出可逐字复现。
  - 核心不变量 I-01..I-15：租约唯一、fencing、幂等键、Unknown、预算原子与如实记账、Manifest/接受版本、权限不扩大、证据一致、停止确认、一次性同意、共享清单单一入口、恢复不自动晋升知识、强隔离实测。
  - 专业化 I-16..I-25：Profile/Skill/反馈不扩权、Attempt 固定输入、共享指令文件不并发覆盖、规则修订检查基础版本、推荐不放宽硬条件、pin 不静默替换、回滚不伪造外部操作、真实质量与 cassette 分离、注入写入不等于模型遵守。
  - 控制面 I-26..I-33：协调不依赖 Agent 在线、Run 固定输入、status 仅领域命令写、invocation 幂等、终态不重跑、预算/Binding/意图事务一致、清理授权、无内置 Agent loop。
  - 多项目与协议 I-34..I-45：成员/安装/指派不自动全权、usage_key 去重、跨项目不复用未授权会话、受限反馈、扁平路由、一套内部契约映射外部协议、证据固定实际组合、离线可管、无 Team 可派、Catalog 升级不扩权、完成需实际必需交付被接受。
  - 门禁 G-1..G-10（依赖方向、状态/账本/租约、动态扩展、能力与隔离 conformance、描述符 fixture、迁移恢复、多 Agent 闭环、预算与不明副作用、证据包、真实平台 smoke）；G-11..G-14（Profile 上下文、路由解释、反馈污染冲突回滚、真实质量）；G-15..G-20（资源并发/状态所有权、reconcile 终态与重启、执行协议、调度公平绑定额度、远程分区与孤儿对账、删除清理恢复）；G-21..G-27（多项目授权撤销、受限反馈、协议子集、联合交付、Catalog 冲突升级、默认轻量装配、Paperclip 版本映射）。
  - RM01..RM09、MD01..MD04、AZ01..AZ06、SB01..SB06 等专项编号按方案文档定义，不在此重定义；引用时必须落到真实测试 case 与报告。
  - 验证状态区分 planned / implemented / passed 且必须有证据；设计条目不等于已实现。未启用能力不要求假测试，但已公开承诺能力不得无条件跳过。
  - 发布前由脚本联合读取用例注册表、测试资产和报告，检查 K ≤ M ≤ N；同一用例重跑只计一次，声明多环境须全部通过。连续两版 N 增量大于 M 增量须记录决定。
  - 支持矩阵按 Supported / Experimental / Planned / Unsupported 声明；协议、CLI、Git、工具链和平台组合固定测试版本。只完成 schema 不能称支持接续、影响分析或运行验收。

  ## 7. 阶段切片（§40.1）
  - P0 最小可信核心 → P1 单执行者交付 → P2 工作接续 → P3 变更与有效协作 → P4 实际运行交付 → P5 复用与团队 → P6 按需开放 → P7 容量评估。
  - 每个阶段一个 OpenSpec Change，按纵向切片实施；出口证据来自实际运行与故障用例，不是设计完成。依赖与安全出口不跳过，阶段不是固定工期。
  - P7 是评估与决策门：按真实 RTO、写入争用、数据体积和多机需求评估，不按日事件数机械迁移，容量结论不自动扩大支持矩阵。

  ## 8. OpenSpec 工件约定
  - 现行 openspec/specs/ 含 13 个 capability：P0 9 个于 2026-11-19 归档（artifact-acceptance、budget-admission、configuration、coordination-loop、effect-gate、execution-adapter、identity-access、recovery-cleanup、resource-state，57 条需求 / 66 个场景），P1 4 个于 2026-11-20 归档（clarity-dialogue、context-assembly、direct-delivery、workspace-execution，21 条需求 / 21 个场景），合计 78 条需求 / 87 个场景。后续 Change 修改既有能力用 MODIFIED/REMOVED，新增能力用 ADDED；禁止引用不存在的现行规格，也不得把已归档规格当可随意改写的草稿。
  - 规格需求用 SHALL 表达可测试义务，每条至少配一个 Given/When/Then 场景，并绑定相关 I/G/RM/MD/AZ/SB 编号或方案文档章节。
  - 任务按垂直切片和依赖排序，逐条带验证出口；未取得真实证据不得勾选，也不得把设计路径写成已通过。
  - 方案文档是产品与技术权威来源；若本上下文与文档冲突，以文档为准并同步修订本配置。

  ## 9. 开发语言、组件清单与目标版本（Target，待 P0 D0 锁定）
  - 版本口径：以下为 2026-11-19 从 Rust stable 通道、crates.io、npm registry 读取的“尽量新稳定”候选基线，状态为 Target/Unverified。D0 spike 必须实际编译、跑通并锁定到 Cargo.lock、package-lock.json、rust-toolchain.toml 与 docs/compat/toolchain.md；锁定结果优先于本节候选值。禁止用 latest 浮动依赖或仅凭文档声明兼容。
  - 语言与工具链：Rust stable 1.100.0、edition 2024，MSRV 与 CI 工具链由 rust-toolchain.toml 固定。Node.js 26.13.1 LTS（Lithium）用于前端构建与测试，CI 与本地一致；若某依赖不兼容 Node 26，回退到次新 LTS 必须在 toolchain.md 记录实测证据。
  - Rust workspace（resolver 3）：crates/bod-core（值类型/纯规则）、crates/bod-app（应用事务/存储/执行装配）、crates/bod（CLI/HTTP 服务）、apps/desktop/src-tauri（bod-desktop 壳）、xtask（开发工具，不进入默认部署）。核心三 crate 不链接 Tauri，桌面壳不另跑控制器。
  - Rust 组件候选版本：tokio 1.54.1（只启用需要的 feature，禁止默认 full）；axum 0.8.9 + tower-http 0.7.1（HTTP/SSE，WebSocket 按需）；reqwest 0.13.5 + 单一 rustls TLS 路线（限制 redirect/proxy/timeout）；rusqlite 0.43.0（原生 SQL、参数绑定、WAL、单写线程、备份 API；不同时引入 ORM/SQLx）；serde 1.0.229 / serde_json 1.0.154 / toml 1.2.1+spec-1.1.0；uuid 1.29.3 / sha2 0.11.1 / thiserror 2.0.21 / anyhow 1.0.104（仅边界）；clap 4.6.8 / tracing 0.1.44 / tracing-subscriber 0.3.23；utoipa 6.0.0（OpenAPI 单源生成）。
  - 桌面与前端候选版本：tauri 2.12.7（Rust crate）与 @tauri-apps/cli 2.12.6（npm，二者独立发布，D0 必须验证配对）；vue 3.5.45 / vue-router 5.5.1 / pinia 4.1.0（仅跨页面状态）/ vite 8.3.8 / @vitejs/plugin-vue 6.0.11；TypeScript 锁定 5.9.x 最新稳定补丁，不直接采用 npm latest 7.0.2——openapi-typescript 7.13.0 的 peer 约束为 typescript ^5.x，升级前须等生态兼容并通过回归；vue-tsc 3.3.14；openapi-typescript 7.13.0。
  - 测试与开发检查：Rust test + proptest 1.12.0（纯规则）+ 临时 SQLite；Vitest 5.1.1；@playwright/test 1.65.1（仅关键流程）；cargo fmt/clippy、cargo-deny/audit、vue-tsc、迁移 lint 与验证索引检查。开发依赖不进入默认产品运行。
  - 外部执行端组件：首选一个经实测的 ACP 或结构化 CLI 运行时；bod-execution/v1 先实现已验证子集。MCP/A2A/CLI 映射按真实包版本、平台与信息损失披露；Node 桥接仅作为按需兼容桥，不是默认依赖。

  ## 10. 兼容性、锁定与升级要求
  - 优先采用仍被生态支持的新稳定版本；若“更新”与 peer 约束、MSRV、目标平台或许可证冲突，以可复现的兼容组合为准并记录取舍，不机械追新。TypeScript 5.x 与 openapi-typescript 7.x 的 peer 冲突是首例，必须进 toolchain.md。
  - 所有版本在 P0 D0 spike 一次性锁定：Cargo.lock、package-lock.json、rust-toolchain.toml、docs/compat/toolchain.md；记录精确版本、features、许可证、MSRV、目标三元组与 OS/WebView 前提。后续升级走变更流程，重新跑 conformance 与回归，不直接改锁文件宣称支持。
  - 兼容性矩阵固定：OS/CPU、Rust/Node 版本、Tauri 壳与 WebView、SQLite 版本与同步策略、Git/CI/CLI/执行端版本、协议版本。无兼容证据的组合标 Experimental 或 Unsupported；不把“能安装”“通用 JSON”或 peer 范围当成支持证据。
  - 版本兼容检查覆盖 UI/API/sidecar/schema 与在途运行；OpenAPI 到 TS 的生成有 CI 漂移检查，DTO 不手抄 Rust 领域状态。破坏性 DDL 默认阻断，确需表重建时要求 risk=destructive、维护窗口、旧库升级与恢复测试。
  - 安全与许可证：cargo-deny/audit 随发布记录；漏洞例外须有到期与责任人；不自研密码算法，TLS 走单一 rustls 路线，避免双 TLS 栈。
  - 首版支持 Linux/WSL2；Windows 原生、macOS、Windows+WSL2 组合与移动端分别实测后开放。Tauri 壳、WebView、sidecar、外部 Agent 分别计入资源预算，不用宿主 RSS 冒充桌面总内存。

  ## 11. 架构风格：分层解耦与受控组件化（非微内核）
  - 判定：本项目采用“单宿主可信控制面 + 分层模块 + 受控适配器边界”，不采用微内核架构。没有可动态安装/卸载的内核插件运行时、统一插件 ABI、进程内第三方代码热加载或中心消息总线；逻辑边界默认实现为受控模块/适配器，不自动变成独立进程、插件协议或数据库（§2.1 原则 11、§2.4）。
  - 理由一（产品目标）：入口简单、默认轻量是硬约束。插件运行时、原生动态库、事件总线会增加安装步骤、常驻进程、内存/磁盘与恢复成本，而首个真实任务不需要这些能力；没有证据的需求先用普通模块或外部工具完成（§2.1、§2.4）。
  - 理由二（正确性与安全）：权威与写入者必须唯一。插件若进入宿主进程会绕过 UnitOfWork、授权、预算、fencing 与审计；外部进程被监督也不等于被沙箱隔离，权限必须单独配置。对黑盒执行端本就不承诺全路径硬停、网络隔离和精确成本，再引入插件只会制造虚假保证（§2.1 原则 3/9、§14、§20.10）。
  - 理由三（验证成本）：支持声明必须绑定真实版本、平台、协议与 conformance 证据。插件化会让 N/M/K 用例、G-3/G-4 门禁和 I-15 强隔离验证按“插件 × 版本 × 平台 × 能力”组合膨胀，且无法只靠设计数量或通用 JSON 接口宣称支持（§39、§41.9、§41.11）。
  - 理由四（需求已可满足）：Profile、Skill、Connector 与外部 Adapter 已经覆盖角色模板、工具接入和运行时差异，新增 Profile 或 Skill 不需要新插件种类或修改宿主；文档明确首版可将步骤合并为少量服务函数，不为每步实现插件框架，也不新增独立服务、事件总线或经理专属 Harness（§14、§19、§33）。
  - 理由五（已明确移除/后置）：自研 Harness、IDE 反向编排插件属于移除项；容器/WASM 沙箱、集群高可用、多机执行属于按需后置，首版不提供第三方原生动态库插件。若真实需求与证据出现，走复杂度准入与支持矩阵后再评估，而不是默认装配（§2.3、§14、§40.4）。
  - 分层与依赖方向：交互层（Tauri 桌面 / CLI / 可选浏览器）→ 应用层（bod-app：命令、UnitOfWork、授权、队列、预算、验收、恢复）→ 领域层（bod-core：值类型与纯规则）→ 基础设施/外部系统（SQLite、CAS、Git/CI/制品/知识库/环境）。bod-core 不依赖 DB/Web/Tauri/Agent SDK；bod-app 依赖 core 并持有 IO 端口；bod 只装配 CLI/HTTP；桌面壳通过固定宿主 API 连接，不另跑控制器。G-1 检查依赖方向与公共类型。
  - 组件化有两层含义，不得混用：业务上 Component 表示子系统/模块，不自动变为 Project、Team 层级或权限继承；工程上按 bod-core / bod-app / bod / bod-desktop / xtask 划分生产与开发边界，连接器与适配器按真实需要逐个实现，首版只做一个必要连接器。新增组件须有真实场景、撤除路径与 conformance 证据。
  - 与插件化的边界：P6 的 SDK / 第三方适配是“第三方不改宿主安装即可接入”的外部能力，通过 bod-execution/v1 已验证子集与版本化支持矩阵开放，不等于把宿主改成微内核；不承诺任意第三方代码在宿主进程内运行或热加载。WASM 后置，必须提供真实可编译接口与等价性测试后才声明支持。
  - 元原则（目标与手段解耦）：开放性/可扩展性是目标，微内核只是实现手段之一，二者不可等同。本项目在契约层、协议层与进程外适配器层已提供“第三方不改宿主安装即可接入”的开放性（P6 SDK / 远程 / 只读），无需进程内插件即可达成开放目标；微内核的核心价值是进程内动态装卸且强隔离，而本项目对黑盒执行端明确不承诺网络隔离、全路径硬停与精确成本（§20.10），该价值主张在此无处安放。“终极方案”不被预设：文档采用复杂度准入 + 支持矩阵 + conformance 证据的演进式原则（§2.4、§39、§41），不把任何静态架构名词认作天然终极形态。仅当出现大量进程内动态装卸需求、稳定 ABI、可实测强隔离且轻量/验证成本可接受时，才走复杂度准入重新评估受限扩展机制，且更可能表现为受控适配器边界的深化而非典型微内核。
  - 工程约束：不首版做微前端；UI 使用生成的 DTO，不维护第二套业务协议。逻辑清晰不要求物理分散，性能优化不得静默降低持久性、授权或验收语义；常驻服务、一级对象、配置字段与新协议均走复杂度准入。
  - 边界验证：G-1（依赖方向与公共类型）、G-3（动态扩展安装）、G-4（能力与隔离 conformance）为架构边界门禁；每个切片的任务必须给出依赖方向、扩展生效范围与不绕过 UnitOfWork/授权/预算的验证出口。

# 按工件追加的强制规则（与 schema 内置指导叠加）。
rules:
  proposal:
    - 写明对应阶段（P0-P7）、方案文档章节、范围、非目标与前置 Change；非目标须包含文档明确移除或后置的能力。
    - 写清该阶段退出证据与 Dependencies；不得把工件完成、schema 完成或设计数量写成出口证据。
    - 不提前声明后续阶段支持；能力状态仅用 Supported / Experimental / Planned / Unsupported。
    - 列出本阶段涉及的组件/版本变化及对兼容矩阵的影响；版本状态用 Target / Unverified / Locked，不用设计推断已兼容。
  specs:
    - 每条 Requirement 使用 SHALL，并至少提供一个 Given/When/Then 场景；绑定 I/G/RM/MD/AZ/SB 编号，无法绑定时注明方案文档章节。
    - 区分宿主权威状态与外部观察：Unknown 不写成成功，反馈不写成接受，估计不写成实测，设计不写成已支持。
    - capability 未归档时用 ADDED；仅在 openspec/specs/ 已存在同名 capability 时才用 MODIFIED/REMOVED。
    - 不承诺第三方非幂等副作用绝对执行一次，除非明确引用其幂等契约且路径受宿主管理。
    - 涉及平台、协议或外部工具版本时写明固定版本与已验证能力子集，不用“支持某生态”代替具体组合。
  design:
    - 每个关键决策写明选择、理由、否决的替代与代价；固定事务边界、状态所有者、并发/幂等键、重试与对账路径。
    - 必须覆盖失败与恢复：回包丢失、宿主崩溃、规格变更、权限撤销、磁盘满、备份恢复，以及 Unknown 对状态与预算的影响。
    - 迁移与兼容写明校验和、风险清单、兼容窗口、回滚/恢复测试；无 conformance 证据不声明平台或协议支持。
    - 与全局架构规范冲突时先提出修订 config.yaml，不在单个 Change 中静默改变跨阶段约束。
    - 写出依赖 features、MSRV、许可证、peer 约束与锁定文件变更；说明为何选该版本而非更新或更旧版本。
    - 新增组件/扩展必须先判定层次归属与依赖方向；不得以插件化或微内核名义绕过 UnitOfWork、授权、预算与 conformance 门禁。
  tasks:
    - 按垂直切片与依赖顺序编号，每项以 - [ ] 开头并写明验证出口（case ID、命令或可观察行为）。
    - 测试与门禁保持 planned，直到有真实报告才勾选；fixture 目录或脚手架不作为通过证据。
    - 不为逻辑边界新建独立 crate/服务/协议；新增默认依赖或一级对象须记录复杂度准入理由（§2.4）。
    - 每个切片闭环包含实现、契约/属性测试、故障注入与验证索引或支持矩阵更新。
    - D0 任务必须包含 Cargo.lock、package-lock.json、rust-toolchain.toml 与 docs/compat/toolchain.md 的锁定，以及真实构建/测试证据。
    - 涉及新组件或适配器时，验证出口须包含依赖方向（G-1）、扩展安装（G-3）与能力/隔离 conformance（G-4），不得只验证模块可编译。

operations:
  apply:
    guidance:
      - 严格按 tasks.md 顺序推进，一次只完成一个切片，保留命令输出、测试报告和故障用例证据。
      - 若实现暴露全局架构规范需要修订，先更新 config.yaml 并说明原因，再继续实现。
      - 只在证据满足验证出口后勾选任务；Unknown、跳过和过期报告如实记录，不用设计结论代替。
      - 升级依赖时先更新 docs/compat/toolchain.md 与验证索引，再改锁文件；不把“可安装”当成通过 conformance。
  archive:
    guidance:
      - 仅当该阶段退出证据齐全且 openspec validate --strict 通过后归档，保留 Change 历史与原证据。
      - 由单一归档入口把 capability 增量同步到 openspec/specs/，随后核对现行规格与验证索引一致。
      - 同步更新支持矩阵、N/M/K 统计与已知限制；未通过项保持 Planned/Unverified 并说明原因。

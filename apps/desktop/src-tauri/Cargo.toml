[package]
name = "bod-desktop"
description = "Tauri 2 桌面壳：P0 任务 8.1 接入 connect_or_spawn 与生命周期原型"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# 复用宿主侧握手实现（`bod serve` 写描述、客户端换会话密钥），
# 避免桌面壳与宿主各写一份协议解析后漂移。
# G-1 只禁止 bod-app → bod-desktop 的反向依赖，这个方向是允许的。
bod-app = { path = "../../../crates/bod-app" }

# P0 最小可信核心 —— I/G 验证索引（G-50）
#
# 本文件是 G-50 的机器可读索引：每条绑定给出不变量/门禁的权威语义、实现模块、
# 承载断言的测试路径与当前状态。`bod verify-index` 与
# `cargo run -p xtask -- verify --stage P0` 都会解析它。
#
# 规则：
# - id 必须唯一；`I-NN` / `G-N` 两种形式；
# - status ∈ implemented / planned / unverified；
#   implemented 必须有 module 与 tests，planned 不得填 tests（避免把计划路径当证据）；
# - requirement 用 V2.9.6 §39.13 / §39.12 / §39.14 的原文语义，不改写成任务口径；
# - note 记录编号或范围差异，不隐藏。


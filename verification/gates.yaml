  requirement: 每工作包执行实例只有一个有效提交租约
  module: bod-app::claim_concurrency
  tests: bod-app::claim_concurrency::tests::i_01_claim_sets_claimed_generation_and_increments_token
  status: implemented
  evidence: cargo test -p bod-app claim_concurrency
  note: ""

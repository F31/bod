  note: "Tier A3：容量按 cache.max_entries / cache.max_bytes 双维度有界且非预分配，LRU 淘汰；单条超上限拒绝写入（不写成功再立刻淘汰）；上限 0 视为关闭缓存而非无界。热点回源由 get_or_load 承担：被淘汰片段从来源重读并以 FragmentSource::Reloaded 标记，回源失败与摘要不符的内容不缓存，撤权时拒绝命中且不借回源绕过权限（failed_or_tampered_reload_is_never_cached / revocation_blocks_reload_instead_of_fetching_again）。隔离与撤权仍由 cache_rejects_cross_company_reads、permission_revocation_rejects_cache_hit_and_reassembles 覆盖，清空由 cache_capacity_is_bounded_not_preallocated_and_evicts_lru 断言即时生效"
